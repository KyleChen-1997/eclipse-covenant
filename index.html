<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>运输船 · FRONTLINE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Noto+Sans+SC:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root{--cyan:#5ee7e9;--red:#f16667;--ink:#071116;--line:rgba(142,220,223,.26)}
    *{box-sizing:border-box} body{margin:0;overflow:hidden;background:#071116;color:#e9ffff;font-family:'Noto Sans SC',sans-serif} canvas{display:block}
    #hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 2px 10px #000;letter-spacing:.04em}
    .top{position:absolute;left:36px;right:36px;top:24px;display:flex;justify-content:space-between;align-items:flex-start}.brand{font:700 27px Rajdhani,sans-serif;letter-spacing:.14em}.brand small{display:block;font:600 11px 'Noto Sans SC';color:#8ab2b4;letter-spacing:.24em;margin-top:3px}.match{display:flex;gap:18px;align-items:center}.score{font:700 26px Rajdhani,sans-serif}.score b{color:var(--cyan)}.score em{font-style:normal;color:#779395;margin:0 5px}.status{border:1px solid var(--line);padding:7px 12px;color:var(--cyan);font:600 12px Rajdhani,sans-serif;letter-spacing:.1em;background:rgba(5,18,22,.55)}
    .bottom{position:absolute;left:36px;right:36px;bottom:25px;display:flex;justify-content:space-between;align-items:end}.weapon{display:flex;gap:18px;align-items:center}.gunname{font:700 22px Rajdhani,sans-serif;letter-spacing:.1em}.gunname small{display:block;color:#87a8aa;font:600 11px 'Noto Sans SC';letter-spacing:.15em}.ammo{font:700 40px Rajdhani,sans-serif}.ammo span{color:#759395;font-size:17px;margin-left:5px}.hint{color:#a7c2c4;font-size:11px;letter-spacing:.12em;text-align:right;line-height:1.9}.cross{position:absolute;left:50%;top:50%;width:20px;height:20px;transform:translate(-50%,-50%)}.cross:before,.cross:after{content:'';position:absolute;background:rgba(218,255,255,.9)}.cross:before{width:2px;height:20px;left:9px}.cross:after{height:2px;width:20px;top:9px}.dot{position:absolute;left:50%;top:50%;width:3px;height:3px;background:#fff;border-radius:50%;transform:translate(-50%,-50%)}#feed{position:absolute;right:35px;top:100px;text-align:right;color:#cfebec;font-size:12px;line-height:1.8}.feed span{color:var(--cyan)}#flash{position:absolute;inset:0;background:rgba(255,255,255,.2);opacity:0;transition:opacity .05s}#help{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(2,8,10,.72);z-index:5}.card{width:min(480px,calc(100% - 40px));border:1px solid rgba(110,220,224,.35);background:linear-gradient(145deg,rgba(12,35,40,.97),rgba(5,15,19,.98));padding:34px 38px;box-shadow:0 20px 80px #000}.card h1{font:700 42px Rajdhani;margin:0 0 4px;letter-spacing:.08em}.card p{color:#9bb5b6;line-height:1.7;font-size:13px}.card button{margin-top:13px;width:100%;padding:14px;border:1px solid var(--cyan);background:var(--cyan);color:#062024;font-weight:800;letter-spacing:.1em;cursor:pointer}.keys{display:flex;gap:12px;margin-top:18px;color:#c6dddd;font-size:11px}.key{border:1px solid var(--line);padding:7px 9px}
  </style>
</head>
<body>
<div id="help"><div class="card"><h1>TRANSPORT SHIP</h1><div style="color:#5ee7e9;font:600 12px Rajdhani;letter-spacing:.2em">FRONTLINE / TEAM DEATHMATCH</div><p>甲板上的快速交火。穿过集装箱通道，利用掩体压制红方目标，争取先拿到 20 次击杀。</p><div class="keys"><div class="key">W A S D 移动</div><div class="key">鼠标瞄准</div><div class="key">左键射击</div><div class="key">R 换弹</div></div><button id="start" onclick="document.getElementById('help').style.display='none'">进入战场</button></div></div>
<div id="hud"><div class="top"><div class="brand">TRANSPORT<span style="color:var(--cyan)"> // </span>SHIP<small>货运甲板 · 07:42 PM</small></div><div class="match"><div class="score"><b id="kills">00</b><em>:</em><span id="enemyScore">00</span></div><div class="status">● LIVE / TEAM DEATHMATCH</div></div></div><div id="feed"></div><div class="cross"><div class="dot"></div></div><div class="bottom"><div class="weapon"><div class="gunname">M4A1-S<small>TACTICAL RIFLE / 5.56 NATO</small></div><div class="ammo" id="ammo">30<span>/ 120</span></div></div><div class="hint">SHIFT SPRINT &nbsp;·&nbsp; SPACE JUMP<br>R RELOAD &nbsp;·&nbsp; ESC RELEASE CURSOR</div></div><div id="flash"></div></div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module" src="./src/main.js?v=4"></script>
</body></html>
