<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星阶觉醒 · 特效预览</title><link rel="stylesheet" href="../star-effects.css"><script defer src="../star-effects.js"></script><style>body{margin:0;background:#0c0e18;color:#f0e4c9;font:15px system-ui}main{max-width:1180px;margin:auto;padding:32px}h1{font:34px Georgia,serif;margin-bottom:12px}p{color:#a7a9c1;line-height:1.8}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}article{min-width:0}.portrait{position:relative;display:block;aspect-ratio:2/3;overflow:hidden;border:1px solid #b6a17250;border-radius:8px}.portrait img{width:100%;height:100%;object-fit:cover}h2{font-size:17px}small{color:#b2a183}.label{position:absolute;left:18px;top:18px;z-index:8;font:24px Georgia,serif;color:#efc779;text-shadow:0 1px 8px #000}button{padding:10px 16px;background:#222334;color:#eee;border:1px solid #aba080;border-radius:5px;margin:0 8px 22px 0}@media(max-width:650px){main{padding:18px}.grid{grid-template-columns:repeat(2,1fr);gap:14px}}</style></head><body><main><small>ASCENSION · THE CELESTIAL AWAKENING</small><h1>星辉藏于边缘。</h1><p>0～5 星只改变边框的材质、层次与流光。人物区域不添加星环、光翼、神冠或粒子。此预览不改变游戏存档。</p><button id="motion">暂停特效</button><div class="grid" id="cards"></div></main><script>addEventListener('DOMContentLoaded',()=>{const S=EclipseStarFx;document.querySelector('#cards').innerHTML=S.names.map((name,n)=>`<article><h2>${n} 星 · ${name}</h2><div class="portrait"><img src="../assets/heroes/astra-v6.png" alt="阿斯忒拉 ${n} 星"><span class="label">UR</span>${S.markup(n)}</div></article>`).join('');document.querySelector('#motion').onclick=e=>{const paused=document.body.classList.toggle('pause');e.target.textContent=paused?'播放特效':'暂停特效';};});</script><style>.pause .star-fx *{animation-play-state:paused!important}</style></body></html>
