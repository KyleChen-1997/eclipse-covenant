<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>群星归环 · 八位角色动态立绘</title><style>body{margin:0;background:#0c101c;color:#eadfc8;font:15px/1.7 system-ui}main{max-width:1280px;margin:auto;padding:28px}h1{font:32px Georgia,serif;margin:8px 0}p,small{color:#adaabc}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}article{padding:14px;background:#181c2a;border:1px solid #d2ba8138;border-radius:9px}video{width:100%;aspect-ratio:2/3;object-fit:cover;background:#090b12}h2{font-size:18px;margin:0 0 12px}button,a{background:#252a3c;border:1px solid #bca47e55;border-radius:5px;color:#e3d0aa;padding:7px 11px;cursor:pointer}nav{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}article a{font-size:12px;display:inline-block;margin-top:10px}article p{font-size:12px;line-height:1.5}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:16px}}@media(max-width:420px){.grid{gap:9px}article{padding:8px}h2{font-size:15px}}</style><main><small>ECLIPSE COVENANT · RETURN TO THE STARS</small><h1>群星归环 · 循环立绘</h1><p>本批八位角色：同一原画约束首尾，动作展开后自然收势。可统一检查首帧、中段和末帧。此页不修改游戏存档。</p><nav><button data-play>全部循环播放</button><button data-pause>全部暂停</button><button data-time="0">首帧</button><button data-time="2.5">动作中段</button><button data-time="end">末帧</button></nav><div class="grid" id="cards"></div></main><script>fetch('../assets/videos/weave-loop-batch.json').then(r=>r.json()).then(b=>{document.querySelector('#cards').innerHTML=b.runs.map(original=>{const r={...original,...original.latestRevision};return `<article><h2>${r.name}</h2><video src="../assets/videos/${r.id}.mp4" poster="${r.input.image}" muted loop playsinline controls preload="metadata"></video><p>${r.reviewSummary||'首尾与动作待检查'}</p>${r.outputUrl?`<a href="${r.outputUrl}" target="_blank" rel="noopener">原始生成视频 ↗</a>`:''}</article>`}).join('');});document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('video').forEach(v=>{if(b.hasAttribute('data-play'))v.play().catch(()=>{});else if(b.hasAttribute('data-pause'))v.pause();else if(b.dataset.time){v.pause();v.currentTime=b.dataset.time==='end'?Math.max(0,v.duration-1/24):Number(b.dataset.time);}});});</script></html>
