<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>眼睑对位验收</title><link rel="stylesheet" href="../living-portraits.css"><style>body{margin:18px;background:#101624;color:#eee;font:12px system-ui}#main{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}article{padding:8px;border:1px solid #70809040}h2{margin:0 0 8px;font-size:12px}.pair{display:flex;gap:4px}.portrait,canvas.ref{position:relative;display:block;width:50%;aspect-ratio:1.36;overflow:hidden}#points{position:fixed;bottom:0;right:0;background:#131725;padding:10px}button{background:#252c3e;color:white;border:1px solid #606080;padding:9px;margin-bottom:10px}</style><h1>眼睑对位：原画 / 闭眼</h1><button id="play">播放自然待机</button><main id="main"></main><pre id="points"></pre><dialog id="dialog"></dialog><script src="../roster.js"></script><script src="../progression.js"></script><script src="../gear-system.js"></script><script src="../inventory.js"></script><script src="../core.js"></script><script src="../portrait-motion.js"></script><script>
const points={},rigs=EclipsePortraitMotion.profiles;let play=false;
for(const h of EclipseCore.HEROES.filter(h=>rigs[h.id])){const rig=rigs[h.id],crop=[rig.head[0]-.15,rig.head[1]-.07,.3,.1472],article=document.createElement('article'),url='../assets/heroes/'+h.art+'.png';article.innerHTML=`<h2>${h.rarity} ${h.name} / ${h.id}</h2><div class="pair"><canvas class="ref"></canvas><span class="portrait" data-living="${h.rarity}" data-live-hero="${h.id}" data-live-art="${url}" data-motion-crop="${crop}" data-pose-time="0" data-pose-blink="1"></span></div>`;document.getElementById('main').append(article);const image=new Image(),canvas=article.querySelector('canvas.ref');canvas.width=400;canvas.height=294;image.onload=()=>canvas.getContext('2d').drawImage(image,crop[0]*1024,crop[1]*1536,crop[2]*1024,crop[3]*1536,0,0,400,294);image.src=url;let next=0;canvas.onclick=e=>{const r=canvas.getBoundingClientRect(),x=Math.round((crop[0]+(e.clientX-r.left)/r.width*crop[2])*1024),y=Math.round((crop[1]+(e.clientY-r.top)/r.height*crop[3])*1536);rig.eyes[next][0]=x/1024;rig.eyes[next][1]=y/1536;(points[h.id]||=[])[next]=[x,y];document.getElementById('points').textContent=JSON.stringify(points,null,2);next=1-next;};}
document.getElementById('play').onclick=e=>{play=!play;document.querySelectorAll('.portrait').forEach(n=>{if(play){delete n.dataset.poseTime;delete n.dataset.poseBlink;}else{n.dataset.poseTime=0;n.dataset.poseBlink=1;}});e.target.textContent=play?'返回闭眼校准':'播放自然待机';};
</script><script src="../living-portraits.js"></script></html>
