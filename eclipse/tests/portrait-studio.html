<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>角色待机动作 · 验收</title><link rel="stylesheet" href="../living-portraits.css"><style>
body{margin:0;padding:24px;background:#0c1220;color:#d8d9e7;font:13px/1.8 system-ui}h1{font:27px Georgia,serif;margin:0}header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}button,select{padding:8px 12px;background:#20283e;border:1px solid #56637f;color:#e1d3ba}label{white-space:nowrap}#main{display:flex;gap:24px;flex-wrap:wrap}.portrait{position:relative;display:block;width:340px;height:510px;overflow:hidden;background-size:cover;background-position:50% 0%}article{max-width:100%;width:340px}article p{color:#99abc5}canvas.zoom{width:100%;height:auto;margin-top:10px;border:1px solid #515f7333}aside{width:300px}pre{white-space:pre-wrap;color:#abcabf}dialog{background:#151c30;color:white;border:1px solid #6c728e}#results{font:12px/1.6 monospace}@media(max-width:700px){body{padding:14px}.portrait{width:100%;height:auto;aspect-ratio:2/3}article{width:calc(50% - 12px)}header{gap:8px}aside{width:100%}}
</style></head><body><header><h1>角色待机动作</h1><select id="hero" aria-label="选择角色"></select><label><input type="checkbox" id="freeze">固定姿态</label><label><input type="checkbox" id="blink">闭眼校准</label><button id="sample">检测动态与背景稳定性</button><button id="pause">检查暂停</button><button id="fallback">Canvas 降级</button></header><p>左：原画 / 右：新待机动态。此页不读取或修改存档。眼部特写用于检查眨眼对位。</p><main id="main"></main><dialog id="dialog"><p>背景待机应暂停。</p><button id="check-pause">检测冻结</button><button id="close">关闭</button><pre id="paused-result"></pre></dialog><script src="../roster.js"></script><script src="../progression.js"></script><script src="../gear-system.js"></script><script src="../inventory.js"></script><script src="../core.js"></script><script src="../portrait-motion.js"></script><script>
const select=document.getElementById('hero'),main=document.getElementById('main'),rigs=EclipsePortraitMotion,heroes=EclipseCore.HEROES.filter(h=>rigs.profiles[h.id]);
select.innerHTML=heroes.map(h=>`<option value="${h.id}">${h.rarity} ${h.name}</option>`).join('');select.value='astra';
function render(){const h=EclipseCore.hero(select.value),path='../assets/heroes/'+h.art+'.png';main.innerHTML=`<article><h2>原画</h2><span class="portrait still" style="background-image:url(${path})"></span><p>原始比例与表情</p><canvas class="zoom before"></canvas></article><article><h2>自然待机</h2><span class="portrait moving" role="img" aria-label="${h.name}动态立绘" data-living="${h.rarity}" data-live-hero="${h.id}" data-live-art="${path}" style="background-image:url(${path})"></span><p>人物待机 · 背景固定</p><canvas class="zoom after"></canvas></article><aside><h2>渲染状态</h2><pre id="results">加载中…</pre></aside>`;document.getElementById('freeze').checked=false;document.getElementById('blink').checked=false;source=new Image();source.src=path;}
let source;render();select.onchange=render;
if(location.search.includes('fallback')){const get=HTMLCanvasElement.prototype.getContext;HTMLCanvasElement.prototype.getContext=function(kind,...args){return kind==='webgl'?null:get.call(this,kind,...args);};}
</script><script src="../living-portraits.js"></script><script>
const moving=()=>document.querySelector('.moving'),surface=()=>moving().querySelector('canvas');let checking=false;
function read(){const c=surface();return c?.width?c.getContext('2d').getImageData(0,0,c.width,c.height):null;}
function delta(a,b,rect=[0,0,1,1]){if(!a||!b||a.width!==b.width||a.height!==b.height)return -1;let count=0,total=0;for(let y=Math.floor(rect[1]*a.height);y<Math.floor((rect[1]+rect[3])*a.height);y++)for(let x=Math.floor(rect[0]*a.width);x<Math.floor((rect[0]+rect[2])*a.width);x++){const i=(y*a.width+x)*4;if(Math.abs(a.data[i]-b.data[i])+Math.abs(a.data[i+1]-b.data[i+1])+Math.abs(a.data[i+2]-b.data[i+2])>9)count++;total++;}return count/total;}
function freeze(){if(document.getElementById('freeze').checked)moving().dataset.poseTime='0';else delete moving().dataset.poseTime;}
document.getElementById('freeze').onchange=freeze;
document.getElementById('blink').onchange=e=>{if(e.target.checked){moving().dataset.poseBlink='1';moving().dataset.poseTime='0';document.getElementById('freeze').checked=true;}else{delete moving().dataset.poseBlink;freeze();}};
setInterval(()=>{const c=surface(),r=rigs.profiles[select.value];if(!c||!source.complete||!source.naturalWidth)return;for(const key of ['before','after']){const out=document.querySelector('.'+key),input=key==='before'?source:c,iw=input.naturalWidth||input.width,ih=input.naturalHeight||input.height;out.width=360;out.height=265;out.getContext('2d').drawImage(input,(r.head[0]-.15)*iw,(r.head[1]-.07)*ih,.3*iw,.1472*ih,0,0,360,265);}if(!checking)document.getElementById('results').textContent=`${select.value}\nRenderer: ${moving().dataset.renderer||'loading'}\nCanvas: ${c.width} × ${c.height}\nVisible: ${moving().classList.contains('is-live-visible')}\nFrame transform: ${getComputedStyle(moving()).transform}`;},160);
document.getElementById('sample').onclick=()=>{if(!moving().classList.contains('is-painted')){document.getElementById('results').textContent='画布尚未就绪，请稍后重试';return;}checking=true;const a=read(),before=document.querySelector('article p').getBoundingClientRect().toJSON(),out=document.getElementById('results');out.textContent='比较实际画布像素…';setTimeout(()=>{const b=read(),change=delta(a,b),hair=delta(a,b,[.15,.25,.2,.30]),cloth=delta(a,b,[.22,.65,.56,.25]),background=delta(a,b,[.03,.015,.12,.035]);out.textContent=`${hair>.01?'PASS':'FAIL'} 发束区域变化 ${(hair*100).toFixed(2)}%\n${cloth>.01?'PASS':'FAIL'} 衣摆区域变化 ${(cloth*100).toFixed(2)}%\n${change>.001?'PASS':'FAIL'} 画面变化 ${(change*100).toFixed(2)}%\n${background>=0&&background<.015?'PASS':'FAIL'} 背景固定区变化 ${(background*100).toFixed(3)}%\n${JSON.stringify(before)===JSON.stringify(document.querySelector('article p').getBoundingClientRect().toJSON())?'PASS':'FAIL'} 文字位置稳定\n${getComputedStyle(moving()).transform==='none'?'PASS':'FAIL'} 无整图缩放\nRenderer: ${moving().dataset.renderer}`;},1700);};
const dialog=document.getElementById('dialog');document.getElementById('pause').onclick=()=>dialog.showModal();document.getElementById('close').onclick=()=>dialog.close();document.getElementById('check-pause').onclick=()=>{const before=read(),out=document.getElementById('paused-result');out.textContent='采样暂停画布…';setTimeout(()=>out.textContent=delta(before,read())===0?'PASS 背景画布冻结':'FAIL 背景仍变化',800);};document.getElementById('fallback').onclick=()=>location.search='?fallback=1';
</script></body></html>
