<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><base href="../"><title>角色外观检查</title><link rel="stylesheet" href="style.css"><script type="importmap">{"imports":{"three":"./vendor/three/three.module.js"}}</script><script src="roster.js"></script><script src="progression.js"></script><script src="gear-system.js"></script><script src="inventory.js"></script><script src="core.js"></script><style>body{overflow:hidden}header{height:64px;padding:12px;display:flex;gap:20px;align-items:center}#view{position:absolute;inset:64px 30% 0 0}#art{position:absolute;right:0;top:64px;width:30%;height:calc(100vh - 64px);object-fit:cover}#status{font-size:12px;color:#cabb9e}.world-labels{display:none}</style></head><body><header><label>检查角色 <select id="hero"></select></label><button id="attack">攻击动作</button><button id="idle">待机动作</button><span id="status">加载中</span></header><div id="view" class="battle-viewport"></div><div id="art" role="img" aria-label="角色卡片原画"></div><script type="module">
import {BattleScene} from './battle3d.js';
const C=EclipseCore,select=document.querySelector('#hero');select.innerHTML=C.HEROES.map(h=>`<option value="${h.id}">${h.rarity} ${h.name}</option>`).join('');select.value='astra';let scene,u,frames=0,started=performance.now();setInterval(()=>{if(!scene?.renderer||!u)return;document.querySelector('#status').textContent=u.clips.size+' 个骨骼动作 · '+scene.renderer.info.render.calls+' 绘制批次 · '+Math.round(scene.renderer.info.render.triangles/1000)+'k 面';},1000);
async function show(){scene?.dispose();const s=C.freshState(),id=select.value,h=C.hero(id);s.owned[id]=1;s.team=[id];const b=C.battle(s,0);b.enemies=[];scene=new BattleScene(document.querySelector('#view'),b,C);await scene.ready;u=[...scene.units.values()][0];scene.layout=()=>{u.home.set(0,.1,0);u.root.position.copy(u.home);u.root.rotation.y=.13;u.facing=.13;};scene.laidOut=false;scene.positionCamera=()=>{scene.camera.position.set(3,2.65,7);scene.camera.lookAt(0,1.3,0);};scene.resize();scene.setPlayback({running:true,speed:1});const art=document.querySelector('#art');art.style.backgroundImage=`url(assets/${h.art?'heroes/'+h.art:h.sheet==='original'?'card-concepts':h.sheet==='dawn'?'heroes-dawn':'heroes-dusk'}.png)`;art.style.backgroundSize=h.art?'cover':h.sheet==='original'?'560.606% auto':'500% auto';art.style.backgroundPosition=h.art?'50% 25%':`${h.sheet==='original'?1.3158+h.index*24.3421:h.index*25}% 22%`;document.querySelector('#status').textContent=u.clips.size+' 个骨骼动作 · 精细外观已加载';}
document.querySelector('#attack').onclick=()=>scene.play(u,['sword_attack','spell1','bow_shoot','attack','punch'],false,1.5);document.querySelector('#idle').onclick=()=>scene.play(u,['idle_weapon','idle'],true);select.onchange=show;show().catch(e=>document.querySelector('#status').textContent=e.stack);
</script></body></html>
